name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --manifest-path core/Cargo.toml

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the Rust core
        run: scripts/build-core.sh
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd app && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          cd app
          xcodebuild build \
            -project Paw.xcodeproj -scheme Paw \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO | tail -60
