name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these UI tests: space-separated Class or Class/test names. Empty runs all."
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The logic is tested on Linux, where runners are faster: the sync tests
  # run against an in-process SSH server and the runner's own git. The same
  # job checks that the Swift bindings still generate.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Two tests check a hostile remote on a file system that ignores case,
      # which they mount in a user namespace. They skip where that is refused.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Test the core
        run: cargo test --manifest-path core/Cargo.toml
      - name: Generate the Swift bindings
        run: scripts/build-core.sh --bindings-only

  # The core contains C (libgit2 and ring), which needs the Apple SDK to
  # compile for iOS, so the iOS libraries are built on a Mac.
  core-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the core for iOS
        run: scripts/build-core.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: |
            app/build/core
            app/Generated
          retention-days: 3

  ui:
    needs: [core, core-ios]
    runs-on: macos-26
    # A full run is split across machines so it takes as long as the slowest
    # part, not the sum. The last part runs every class the others do not
    # name, so a new test class is never left out. A run narrowed with `only`
    # uses one machine.
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone]
        part: ${{ fromJSON(inputs.only && '["rest"]' || '["app","setup","edit","rest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the simulator booting
        run: |
          udid=$(scripts/ci-sim.sh ${{ matrix.family }})
          echo "PAW_SIM=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > /dev/null 2>&1 &
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: app
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          scripts/make-xcframework.sh
      - name: Run the UI tests
        env:
          PAW_ONLY: ${{ inputs.only || (matrix.part == 'app' && 'AppTests') || (matrix.part == 'setup' && 'SetupTests') || (matrix.part == 'edit' && 'EditTests') || '' }}
          PAW_SKIP: ${{ (!inputs.only && matrix.part == 'rest') && 'AppTests SetupTests EditTests' || '' }}
        run: scripts/ci-test.sh ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.family }}${{ inputs.only && '' || format('-{0}', matrix.part) }}
          path: app/build/report
          retention-days: 7

  # An unsigned build for real devices. It is signed on the developer's own
  # machine (scripts/install.sh), so the signing key never leaves it.
  device:
    needs: [core, core-ios]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: app
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          scripts/make-xcframework.sh
      - name: Build for devices, unsigned
        run: |
          set -o pipefail
          cd app
          xcodebuild build \
            -project Paw.xcodeproj -scheme Paw -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO > build/device.log 2>&1 \
            || { grep -E "error:|ld: " build/device.log | awk '!seen[$0]++'; exit 1; }
          cd build/derived/Build/Products/Debug-iphoneos
          zip -qry "$GITHUB_WORKSPACE/Paw.app.zip" Paw.app
      - uses: actions/upload-artifact@v4
        with:
          name: device-app
          path: Paw.app.zip
          retention-days: 7
