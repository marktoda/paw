name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these tests: space-separated Class or Class/test names, UI (app/PawUITests) or unit (app/PawTests). The unit tests always run too. Empty runs all."
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The logic is tested on Linux, where runners are faster: the sync tests
  # run against an in-process SSH server and the runner's own git. The same
  # job tests the core as devices get it, without the `sim` feature, and
  # checks that both sets of Swift bindings still generate (which also
  # scans the host build without `sim`: scripts/check-no-sim.sh).
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Two tests check a hostile remote on a file system that ignores case,
      # which they mount in a user namespace. They skip where that is refused.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Test the core
        run: cargo test --manifest-path core/Cargo.toml
      - name: Test the core without the simulation
        run: cargo test --manifest-path core/Cargo.toml --no-default-features --target-dir core/target/no-sim
      - name: Generate the Swift bindings
        run: scripts/build-core.sh --bindings-only

  # The core contains C (libgit2 and ring), which needs the Apple SDK to
  # compile for iOS, so the iOS libraries are built on a Mac.
  core-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Most changes do not touch the core. Its iOS libraries and bindings are
      # kept by the hash of what they are built from, and reused when it has
      # not changed.
      - uses: actions/cache@v4
        id: built
        with:
          path: |
            app/build/core
            app/Generated
          key: core-ios-${{ hashFiles('core/**', 'app/project.yml', 'scripts/build-core.sh', 'scripts/check-no-sim.sh', 'scripts/make-xcframework.sh') }}
      - uses: Swatinem/rust-cache@v2
        if: steps.built.outputs.cache-hit != 'true'
        with:
          workspaces: core
      - name: Build the core for iOS
        if: steps.built.outputs.cache-hit != 'true'
        run: scripts/build-core.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: |
            app/build/core
            app/Generated
          retention-days: 3

  # Splits the UI tests across machines (up to 5 for a full run, 4 for a
  # narrowed one) so a run takes as long as its slowest part. The unit
  # tests (app/PawTests, seconds in all) run once: in the last part of a
  # full run, which names no tests and so runs them, and in the first part
  # of a narrowed one (`unit`). On a push to
  # main it also looks for a full run that already passed on exactly these
  # files (same git tree, e.g. the branch that was fast-forwarded) and, if
  # there is one, the simulator jobs are skipped.
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      tested: ${{ steps.tested.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Look for a full run on the same files
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          [ -n "$TREE" ] || exit 0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&per_page=50" \
              -q ".workflow_runs[] | select(.head_commit.tree_id == \"$TREE\" and .id != $GITHUB_RUN_ID) | .id"); do
            # Only a full run counts: one split as "full" with its iPad part,
            # every part passed.
            full=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              -q '[.jobs[] | select((.name | startswith("ui (full")) or .name == "ui (ipad)")] | any(.name == "ui (ipad)") and any(.name | startswith("ui (full")) and all(.conclusion == "success")')
            if [ "$full" = "true" ]; then
              echo "Run $id already passed every UI test on this tree; skipping them."
              echo "run=$id" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - name: Split the UI tests
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os, re, sys
          # Seconds a test of each class takes on a runner (scripts/ci-report.sh
          # prints them). Only the balance between parts depends on these.
          # Measured on run 45500441073 (2026-11-24). Since then 3 AppTests and
          # 4 LifecycleTests became unit tests (app/PawTests); each class's
          # per-test weight stands.
          weight = {"EditTests": 123, "SyncTests": 113, "LifecycleTests": 116, "SettingsRestTests": 78,
                    "KeyTests": 65, "EnclaveTests": 59, "BackgroundRefreshTests": 59, "GitHubTests": 55,
                    "AppTests": 53, "StoreTests": 52, "LicencesTests": 50, "SetupTests": 32,
                    "GalleryTests": 32, "AutoFillTests": 21, "AutoFillRestTests": 21}
          tests = {}
          for path in sorted(glob.glob("app/PawUITests/*.swift")):
              cls = None
              for line in open(path):
                  m = re.match(r"\s*(?:final\s+)?class\s+(\w+)\s*:", line)
                  if m:
                      cls = m.group(1)
                  m = re.match(r"\s*func\s+(test\w*)\s*\(\s*\)", line)
                  if m and cls:
                      tests.setdefault(cls, []).append(m.group(1))
          w = lambda cls: weight.get(cls, 60)
          only = os.environ.get("ONLY", "").split()
          # A narrowed run always runs every unit test, in its first part, so
          # a unit test class named (app/PawTests/<Class>.swift) needs no part
          # of its own.
          unit_classes = {"PawTests"} | {os.path.basename(p)[:-6] for p in glob.glob("app/PawTests/*.swift")}
          named_only = only
          only = [n for n in only if n.split("/")[0] not in unit_classes]
          if named_only and not only:
              only = ["PawTests"]
          parts = []
          if only:
              # One machine per class named, at most 4.
              groups = {}
              for name in only:
                  groups.setdefault(name.split("/")[0], []).append(name)
              # The iPad tests get their own part, on an iPad; the rest never do.
              pad = groups.pop("IPadTests", None)
              load = lambda names: sum(w(n.split("/")[0]) * (1 if "/" in n else len(tests.get(n, [1]))) for n in names)
              bins = [[] for _ in range(min(4, len(groups)))]
              for cls in sorted(groups, key=lambda c: -load(groups[c])):
                  min(bins, key=load).extend(groups[cls])
              n = len(bins)
              # The first part runs the unit tests as well (PAW_UNIT).
              parts = [{"name": f"only-{i + 1}-of-{n}", "only": " ".join(b), "skip": "", "unit": "1" if i == 0 else ""}
                       for i, b in enumerate(bins)]
              if pad:
                  parts.append({"name": "ipad", "only": " ".join(pad), "skip": "", "family": "iPad"})
          else:
              # Tests in class order, cut into 5 parts of about equal time.
              # The last part runs whatever the others do not name, so a test
              # this misses still runs.
              k = 5
              # The iPad tests run once, on an iPad simulator, as their own part.
              pad = tests.pop("IPadTests", None)
              items = [(cls, t) for cls in sorted(tests) for t in tests[cls]]
              # The last part also runs the unit tests: leave it that much less.
              unit = 40
              total = sum(w(c) for c, _ in items) + unit
              bins = [[] for _ in range(k)]
              done = 0
              for cls, t in items:
                  bins[min(k - 1, int((done + w(cls) / 2) / total * k))].append((cls, t))
                  done += w(cls)
              names = []
              for b in bins:
                  # A class wholly in one part is named once.
                  whole = [c for c in dict.fromkeys(c for c, _ in b) if len([1 for c2, _ in b if c2 == c]) == len(tests[c])]
                  names.append(whole + [f"{c}/{t}" for c, t in b if c not in whole])
              named = [n for b in names[:-1] for n in b]
              parts = [{"name": f"full-{i + 1}-of-{k}", "only": " ".join(b), "skip": ""} for i, b in enumerate(names[:-1]) if b]
              parts.append({"name": f"full-{k}-of-{k}", "only": "", "skip": " ".join(named + (["IPadTests"] if pad else []))})
              if pad:
                  parts.append({"name": "ipad", "only": "IPadTests", "skip": "", "family": "iPad"})
          for p in parts:
              # A part that names the iPad tests runs on an iPad.
              p.setdefault("family", "iPad" if "IPadTests" in p["only"] else "iPhone")
              print(p["name"], p["family"], "only:", p["only"] or "-", "skip:", p["skip"] or "-", file=sys.stderr)
          print("parts=" + json.dumps({"include": parts}))
          PY

  ui:
    # The Rust tests run alongside; a failure there still fails the run.
    needs: [core-ios, plan]
    if: needs.plan.outputs.tested == ''
    name: ui (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the simulator booting
        run: |
          udid=$(scripts/ci-sim.sh ${{ matrix.family }})
          echo "PAW_SIM=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > /dev/null 2>&1 &
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: app
      - name: Generate the Xcode project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install xcodegen || { sleep 30; brew install xcodegen; }
          scripts/make-xcframework.sh
      - name: Run the UI tests
        env:
          PAW_ONLY: ${{ matrix.only }}
          PAW_SKIP: ${{ matrix.skip }}
          PAW_UNIT: ${{ matrix.unit }}
        run: scripts/ci-test.sh ${{ matrix.family }}
      # Keeps the device job's scan honest: every pattern it looks for must
      # be found in this Debug simulator build, which has all of it. (A Debug
      # build may put the code in a `.debug.dylib` beside the executable.)
      - name: The device scan finds the debug harnesses in the simulator build
        if: ${{ !cancelled() }}
        run: |
          products=app/build/derived/Build/Products/Debug-iphonesimulator
          binaries=$(find "$products/Paw.app" -type f \( -name Paw -o -name PawAutoFill -o -name '*.debug.dylib' \))
          scripts/check-no-sim.sh --expect --app $binaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.family }}-${{ matrix.name }}
          path: app/build/report
          retention-days: 7

  # The build for real devices: Release (optimised, no DEBUG) against the
  # core built without the `sim` feature, unsigned. It is signed on the
  # developer's own machine (scripts/install.sh), so the signing key never
  # leaves it. The scan proves the simulated hardware, the PIN-taking test
  # path and the debug harnesses are not in what gets installed.
  device:
    # The Rust tests run alongside; a failure there still fails the run.
    needs: [core-ios]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: app
      - name: Generate the Xcode project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install xcodegen || { sleep 30; brew install xcodegen; }
          scripts/make-xcframework.sh
      - name: Build for devices in Release, unsigned
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          cd app
          xcodebuild build \
            -project Paw.xcodeproj -scheme Paw -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO PAW_COMMIT="${COMMIT:0:7}" > build/device.log 2>&1 \
            || { grep -E "error:|ld: " build/device.log | awk '!seen[$0]++'; exit 1; }
      - name: Scan the device build
        run: |
          app=app/build/derived/Build/Products/Release-iphoneos/Paw.app
          appex="$app/PlugIns/PawAutoFill.appex"
          configuration=$(/usr/libexec/PlistBuddy -c 'Print :PawConfiguration' "$app/Info.plist")
          commit=$(/usr/libexec/PlistBuddy -c 'Print :PawCommit' "$app/Info.plist")
          echo "Settings will say: $commit · $configuration"
          [ "$configuration" = Release ] || { echo "the device build is $configuration, not Release"; exit 1; }
          if find "$app" -name '*.debug.dylib' | grep -q .; then
            echo "the device build has a debug dylib"; exit 1
          fi
          scripts/check-no-sim.sh app/build/core/ios/libpaw_core.a
          scripts/check-no-sim.sh --app "$app/Paw" "$appex/PawAutoFill"
          ls -l "$app/Paw" "$appex/PawAutoFill" app/build/core/ios/libpaw_core.a
      - name: Pack the app
        run: |
          cd app/build/derived/Build/Products/Release-iphoneos
          zip -qry "$GITHUB_WORKSPACE/Paw.app.zip" Paw.app
      - uses: actions/upload-artifact@v4
        with:
          name: device-app
          path: Paw.app.zip
          retention-days: 7
