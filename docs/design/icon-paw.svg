    <circle cx="394" cy="286" r="90"/>
    <circle cx="630" cy="286" r="90"/>
    <circle cx="811" cy="438" r="78"/>
  </g>
  <circle cx="512" cy="610" r="200" fill="#F5B301" stroke="#B26A00" stroke-width="24"/>
</svg>
