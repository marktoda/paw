<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">paw icon candidate B: a paw print made of discs, the large pad is the gold key disc</title>
  <!-- Full-bleed square: iOS applies the corner mask. -->
