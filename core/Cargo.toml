[package]
name = "paw-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["lib", "staticlib"]

# Generates the Swift bindings (scripts/build-core.sh). Behind its own
# feature, so its dependencies are not the library's.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The simulated key, the fixture store, the software keystore and clock, and
# the simulated git host (`src/sim`). On by default, so tests, the iOS
# simulator and Debug builds have them; a Release device build is made with
# `--no-default-features` and `scripts/check-no-sim.sh` proves they are gone
# (design.md 5.5).
default = ["sim"]
sim = ["dep:ed25519-dalek", "dep:flate2", "dep:sha1", "dep:x25519-dalek", "tokio/io-util"]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
base64 = "0.22"
card-backend = "0.2.0"
# Seals Face ID copies (see src/copies/format.rs).
chacha20poly1305 = "0.10"
# The simulated key's authentication key.
ed25519-dalek = { version = "2", optional = true }
# Only the simulated git host uses it, to find where a pushed pack ends.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"], optional = true }
# libgit2 is compiled from the vendored source with no TLS and no libssh2:
# the only transport is our own, over russh (see src/sync/transport.rs).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
hmac = "0.12"
# International domain names for site matching (src/store/service.rs): UTS-46
# to the `xn--` form. The adapter is pinned to 1.1, its unicode-rs back end
# (small, pure Rust), instead of ICU4X.
idna = "1.1"
idna_adapter = "=1.1.0"
openpgp-card = "0.7.3"
openpgp-card-rpgp = "0.9.1"
pgp = "0.21.1"
psl = "2"
rand = "0.8"
# GitHub sign-in (src/github): JSON from GitHub's API. Already in the tree
# through pgp.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No RSA, no compression, and ring rather than aws-lc: ring builds with the
# C compiler alone, aws-lc also wants cmake on some targets.
russh = { version = "0.65.4", default-features = false, features = ["ring"] }
# The simulated key's OpenPGP fingerprints.
sha1 = { version = "0.11.0", optional = true }
# One-time codes (src/otp.rs): the SHA-1 that hmac 0.12 takes. Already in the
# tree through pgp.
sha1_hmac = { package = "sha1", version = "0.10" }
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
unicode-normalization = "0.1"
# Full Unicode case folding, for names that are one name on an iPhone.
unicase = "2.9"
uniffi = { version = "0.32.2", default-features = false }
# GitHub sign-in (src/github): a small blocking HTTP/1.1 client over rustls
# with ring (already here through russh) and the Mozilla roots compiled in
# (webpki-roots). No OpenSSL, no aws-lc, no platform verifier, no gzip, no
# new C. Only github.com and api.github.com are ever contacted with it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The simulated key's decryption key.
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
zeroize = "1"

[dev-dependencies]
proptest = "1"
# An ed25519 verifier that shares no code with the simulated card's signer.
ring = "0.17"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "macros"] }
