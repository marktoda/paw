[package]
name = "paw-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
card-backend = "0.2.0"
openpgp-card = "0.7.3"
openpgp-card-rpgp = "0.9.1"
pgp = "0.21.1"
rand = "0.8"
thiserror = "2.0.21"
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
rand = "0.8"
sha1 = "0.11.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }
