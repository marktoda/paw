name: Paw
options:
  bundleIdPrefix: com.marktoda
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # The commit Settings shows (Paw/BuildStamp.swift). CI passes the real
    # one on the xcodebuild command line.
    PAW_COMMIT: unknown
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "NO"
  configs:
    # Debug: the simulator and its UI tests. The component gallery, the
    # launch-argument harnesses and the debug screens are compiled under
    # DEBUG only, and the simulated hardware under
    # `targetEnvironment(simulator)` as well.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    # Release: what is installed on a device (the CI `device` job,
    # scripts/install.sh). Optimised, no DEBUG, and linked against the core
    # built without the `sim` feature (scripts/build-core.sh).
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
targets:
  Paw:
    type: application
    platform: iOS
    sources:
      - Paw
      - Shared
      - Generated
    dependencies:
      - framework: build/PawCore.xcframework
        embed: false
      # What the C inside the core (libgit2) links against.
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: Security.framework
      - sdk: CryptoTokenKit.framework
      - target: PawAutoFill
    info:
      path: Paw/Info.plist
      properties:
        CFBundleDisplayName: Paw
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Settings › About › Build (Paw/BuildStamp.swift).
        PawCommit: $(PAW_COMMIT)
        PawConfiguration: $(CONFIGURATION)
        NSFaceIDUsageDescription: "Face ID opens an entry you recently opened with your key, until the time you chose runs out. Your passcode cannot be used instead."
    entitlements:
      path: Paw/Paw.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # The store, the Face ID copies and their keychain items, shared
        # with the AutoFill extension (app/Shared/Store/StoreLocation.swift).
        com.apple.security.application-groups:
          - group.com.marktoda.paw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marktoda.paw
  PawAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - PawAutoFill
      # Settings, the identity store writer and the debug harness are the
      # app's: the extension never publishes suggestions or hosts tests.
      - path: Shared
        excludes:
          - "AutoFill/App/**"
          - "Store/App/**"
      - Generated
    dependencies:
      - framework: build/PawCore.xcframework
        embed: false
      # What the C inside the core (libgit2) links against.
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: Security.framework
      - sdk: CryptoTokenKit.framework
      - sdk: AuthenticationServices.framework
    info:
      path: PawAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Paw
        NSFaceIDUsageDescription: "Face ID fills passwords you recently opened with your key. Your passcode cannot be used instead."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    entitlements:
      path: PawAutoFill/PawAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - group.com.marktoda.paw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marktoda.paw.autofill
  PawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PawUITests
    dependencies:
      - target: Paw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marktoda.paw.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Paw
schemes:
  Paw:
    build:
      targets:
        Paw: all
        PawUITests: [test]
    test:
      targets:
        - PawUITests
