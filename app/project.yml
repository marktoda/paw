name: Paw
options:
  bundleIdPrefix: com.marktoda
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # The commit Settings shows (Paw/BuildStamp.swift). CI passes the real
    # one on the xcodebuild command line.
    PAW_COMMIT: unknown
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "NO"
  configs:
    # Debug: the simulator and its UI tests. The launch arguments, the
    # component gallery and the debug screens are compiled under DEBUG
    # only, and the simulated hardware and every harness (Paw/Simulator,
    # Shared/Simulator) under `targetEnvironment(simulator)` as well.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      # The unit tests (PawTests) reach the app's internal types.
      ENABLE_TESTABILITY: "YES"
    # Release: what is installed on a device (the CI `device` job,
    # scripts/install.sh). Optimised, no DEBUG, and linked against the core
    # built without the `sim` feature (scripts/build-core.sh).
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
targets:
  Paw:
    type: application
    platform: iOS
    sources:
      - Paw
      - Shared
      - Generated
    dependencies:
      - framework: build/PawCore.xcframework
        embed: false
      # What the C inside the core (libgit2) links against.
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: Security.framework
      - sdk: CryptoTokenKit.framework
      - target: PawAutoFill
    info:
      path: Paw/Info.plist
      properties:
        CFBundleDisplayName: Paw
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad: every orientation, and no UIRequiresFullScreen, so Split
        # View, Slide Over and windows work (Paw/Views/SplitRootView.swift).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Settings › About › Build (Paw/BuildStamp.swift).
        PawCommit: $(PAW_COMMIT)
        PawConfiguration: $(CONFIGURATION)
        NSFaceIDUsageDescription: "Face ID opens an entry you recently opened with your key, until the time you chose runs out. Your passcode cannot be used instead."
        # The background check with the GitHub sign-in (Paw/Sync/BackgroundRefresh.swift).
        BGTaskSchedulerPermittedIdentifiers:
          - com.marktoda.paw.refresh
        UIBackgroundModes:
          - fetch
    entitlements:
      path: Paw/Paw.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # The store, the Face ID copies and their keychain items, shared
        # with the AutoFill extension (app/Shared/Store/StoreLocation.swift).
        com.apple.security.application-groups:
          - group.com.marktoda.paw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marktoda.paw
  PawAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - PawAutoFill
      # Everything in Shared, as the app has it: Shared holds only what
      # both compile, and app-only code lives under Paw.
      - Shared
      - Generated
    dependencies:
      - framework: build/PawCore.xcframework
        embed: false
      # What the C inside the core (libgit2) links against.
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: Security.framework
      - sdk: CryptoTokenKit.framework
      - sdk: AuthenticationServices.framework
    info:
      path: PawAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Paw
        NSFaceIDUsageDescription: "Face ID fills passwords and codes you recently opened with your key. Your passcode cannot be used instead."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              # iOS 18 one-time-code AutoFill: the key icon in a code field.
              ProvidesOneTimeCodes: true
    entitlements:
      path: PawAutoFill/PawAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - group.com.marktoda.paw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marktoda.paw.autofill
  PawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PawUITests
    dependencies:
      - target: Paw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marktoda.paw.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Paw
  # Unit tests, hosted in the Debug simulator app: the models and the
  # wording, on the core's simulated key, keystore, clock and fixture
  # store in-process, with no UI. They run once per CI run
  # (scripts/ci-test.sh).
  PawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PawTests
    dependencies:
      - target: Paw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marktoda.paw.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Paw.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Paw
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Paw:
    build:
      targets:
        Paw: all
        PawUITests: [test]
        PawTests: [test]
    test:
      targets:
        - PawUITests
        - PawTests
